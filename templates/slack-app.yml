# Slack app manifest for logbook. Create the app from this file (api.slack.com/apps,
# "Create New App", "From a manifest"), install it to the workspace, and use the
# Bot User OAuth Token (xoxb-...) as LOGBOOK_SLACK_TOKEN.
display_information:
  name: logbook
  description: Posts logbook issue progress, briefings and results to one thread per issue
features:
  bot_user:
    display_name: logbook
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - files:write
      - channels:history
      - groups:history
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
